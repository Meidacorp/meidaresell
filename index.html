<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Meida Resell — accompagnement achat-revente sneakers" />
  <title>Meida Resell</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }
    /* ── LE QUADRILLAGE ──
       Un seul endroit à toucher : --grille = intensité (0 = invisible, .2 = très marqué),
       --maille = taille des carreaux. */
    :root { --grille: .13; --maille: 54px; }

    body {
      color:#fff; font-family:'DM Sans',system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased;
      background-color:#080808;
      background-image:
        linear-gradient(to right, rgba(255,255,255,var(--grille)) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,var(--grille)) 1px, transparent 1px);
      background-size:var(--maille) var(--maille);
      background-attachment:fixed;
    }
    a { text-decoration:none; color:inherit; }
    button, input, select { font-family:inherit; }
    ::-webkit-scrollbar { width:0; display:none; }

    /* conteneur : mobile d'abord, s'élargit sur PC */
    .wrap { width:100%; max-width:560px; margin:0 auto; padding:0 20px; }

    .h1 { font-size:30px; font-weight:900; line-height:1.12; letter-spacing:-.02em; text-align:center; }
    .h2 { font-size:26px; font-weight:900; line-height:1.2; letter-spacing:-.02em; text-align:center; }

    .cta {
      display:block; width:100%; border:none; cursor:pointer;
      background:linear-gradient(135deg,#FF2E89,#8A0048); color:#fff;
      padding:18px 22px; border-radius:999px; font-size:16px; font-weight:800;
      transition:transform .2s, box-shadow .25s; text-align:center;
    }
    .ctaWrap { margin-top:22px; }

    .lab { display:block; font-size:13.5px; font-weight:700; color:#fff; margin:16px 0 8px; }
    .inp {
      width:100%; background:#161616; border:1px solid #2a2a2a; color:#fff;
      font-size:15px; padding:15px 15px; border-radius:12px; outline:none;
      transition:border-color .2s;
    }
    .inp:focus { border-color:#FF2E89; }
    .inp::placeholder { color:#5f5f5f; }

    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .gridEtapes { display:grid; grid-template-columns:1fr; gap:10px; }   /* empilé sur mobile */
    .statN { font-size:19px; font-weight:900; color:#FF2E89; letter-spacing:-.02em; line-height:1.15; }
    .statL { font-size:11px; color:#9a9a9a; margin-top:7px; line-height:1.4; }
    .gridProof { column-count:2; column-gap:10px; }
    .proofItem { break-inside:avoid; margin-bottom:10px; }

    /* SLIDER DES OFFRES */
    .sliderWrap {
      overflow-x:auto; overflow-y:hidden;
      scroll-snap-type:x mandatory; scroll-padding:0 20px;
      -webkit-overflow-scrolling:touch; padding:2px 20px 6px;
      overscroll-behavior-x:contain;
    }
    .sliderWrap::-webkit-scrollbar { display:none; }
    .slider { display:flex; gap:12px; width:max-content; }
    .slide { scroll-snap-align:start; scroll-snap-stop:always; width:min(80vw, 330px); flex:0 0 auto; }
    .dots { display:flex; justify-content:center; align-items:center; gap:7px; margin-top:14px; }

    /* HERO : halo + grille */
    .hero { position:relative; overflow:hidden; padding-bottom:12px; }
    .heroGlow {
      position:absolute; inset:0; pointer-events:none;
      background:radial-gradient(ellipse 90% 55% at 50% -8%, rgba(255,46,137,.34), rgba(255,46,137,.06) 45%, transparent 70%);
    }
    /* les cartes gardent un fond plein pour que la grille reste en arrière-plan */

    @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(255,46,137,.45);} 50%{box-shadow:0 0 0 14px rgba(255,46,137,0);} }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.35;} }
    @keyframes slideDown { from{opacity:0;transform:translateY(-12px);} to{opacity:1;transform:translateY(0);} }
    @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
    @keyframes slide { from{transform:translateX(0);} to{transform:translateX(-50%);} }

    /* ─────────── PC ─────────── */
    @media (min-width: 900px) {
      .wrap { max-width:1080px; padding:0 40px; }
      .h1 { font-size:48px; max-width:860px; margin:0 auto; }
      .h2 { font-size:38px; }
      .videoWrap { max-width:720px; margin:0 auto; }
      .ctaWrap { max-width:560px; margin-left:auto; margin-right:auto; margin-top:26px; }
      .cta { font-size:17px; padding:20px 26px; }
      .grid3 { gap:18px; }
      .gridEtapes { grid-template-columns:repeat(3,1fr); gap:18px; }
      .statN { font-size:30px; }
      .statL { font-size:13px; }
      .gridProof { column-count:3; column-gap:16px; }
      .proofItem { margin-bottom:16px; }
      .hero { padding-bottom:26px; }
      .sliderWrap { overflow:visible; padding:0 40px; max-width:1080px; margin:0 auto; }
      .slider { width:auto; gap:18px; margin:0 auto; }
      .slide { width:auto; flex:1 1 0; }
      .dots { display:none; }
    }
    @media (min-width: 1280px) {
      .wrap { max-width:1140px; }
      .sliderWrap { max-width:1140px; }
    }
</style>

const ouvrirForm = () => window.dispatchEvent(new Event("meida:open"));

function useInView(ref, once = true) {
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); if (once) obs.disconnect(); }
    }, { threshold: 0.12 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return inView;
}

function Anim({ children, delay = 0 }) {
  const ref = useRef(null);
  const inView = useInView(ref);
  return (
    <div ref={ref} style={{
      opacity: inView ? 1 : 0,
      transform: inView ? "translateY(0)" : "translateY(26px)",
      transition: `opacity .6s ease ${delay}s, transform .6s ease ${delay}s`,
    }}>{children}</div>
  );
}

function Section({ children, style }) {

function Video() {
  const [sound, setSound] = useState(false);
  const [blocked, setBlocked] = useState(false);
  const [erreur, setErreur] = useState(false);
  const v = useRef(null);

  useEffect(() => {
    if (!C.video || !C.autoLecture) { setBlocked(true); return; }
    const el = v.current;
    if (!el) return;
    el.muted = true;
    const pr = el.play();
    if (pr && pr.catch) pr.catch(() => setBlocked(true));
  }, []);

  // le formulaire s'ouvre : on coupe la VSL pour qu'elle ne se superpose pas
  // à la vidéo du formulaire. Au retour, le bouton play réapparaît et la
  // lecture repart où elle s'était arrêtée.
  useEffect(() => {
    const stop = () => {
      const el = v.current;
      if (!el) return;
      el.pause();
      el.muted = true;
      setSound(false);
      setBlocked(true);
    };
    window.addEventListener("meida:open", stop);
    return () => window.removeEventListener("meida:open", stop);
  }, []);

  if (!C.video) return null;

  const activer = () => {
    setSound(true); setBlocked(false);
    const el = v.current;
    if (!el) return;
    el.muted = false;
    if (el.currentTime < C.rejouerSiAvant) el.currentTime = 0;
    const pr = el.play(); if (pr && pr.catch) pr.catch(() => {});
  };

  return (
    <div className="videoBox" style={{ position: "relative", aspectRatio: C.ratio, background: "#000", borderRadius: 20, overflow: "hidden", border: `1px solid ${sound ? "rgba(255,46,137,.5)" : BORDER}`, boxShadow: sound ? "0 20px 60px rgba(255,46,137,.14)" : "0 20px 60px rgba(0,0,0,.6)" }}>
      <video ref={v} src={C.video} poster={C.poster}
        autoPlay={C.autoLecture} muted playsInline preload="auto" controls={sound}
        onClick={() => { if (!sound) activer(); }}
        onError={() => setErreur(true)}
        style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", cursor: sound ? "default" : "pointer" }} />

      {erreur && (
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8, background: "rgba(0,0,0,.88)", padding: 24, textAlign: "center" }}>
          <div style={{ color: "#fff", fontSize: 15, fontWeight: 700 }}>Vidéo introuvable</div>
          <div style={{ color: MUTED, fontSize: 13, lineHeight: 1.6 }}>
            Le fichier <b style={{ color: "#fff" }}>{C.video}</b> doit se trouver dans le même dossier que cette page.
          </div>
        </div>
      )}

      {blocked && !erreur && (
        <div onClick={activer} style={{ position: "absolute", inset: 0, cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14 }}>
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to bottom, rgba(0,0,0,.3), rgba(0,0,0,.75))" }} />
          <div style={{ position: "relative", width: 72, height: 72, borderRadius: "50%", background: `linear-gradient(135deg, ${PINK}, ${PINK_DK})`, display: "flex", alignItems: "center", justifyContent: "center", animation: "glow 2.2s infinite" }}>
            <span style={{ color: "#fff", fontSize: 26, marginLeft: 4 }}>▶</span>
          </div>
          <div style={{ position: "relative", background: "rgba(0,0,0,.6)", border: "1px solid rgba(255,255,255,.14)", borderRadius: 999, padding: "8px 16px", color: "#fff", fontSize: 13, fontWeight: 600 }}>{C.playLabel}</div>
        </div>
      )}

      {!blocked && !sound && !erreur && (
        <div onClick={activer} style={{ position: "absolute", left: 0, right: 0, bottom: 0, padding: "40px 12px 14px", cursor: "pointer", background: "linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0))", display: "flex", justifyContent: "center" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 9, background: `linear-gradient(135deg, ${PINK}, ${PINK_DK})`, borderRadius: 999, padding: "11px 20px", color: "#fff", fontSize: 14, fontWeight: 700, animation: "glow 2.2s infinite" }}>
            <span style={{ fontSize: 16 }}>🔇</span> {C.sonLabel}
          </div>
        </div>
      )}
    </div>
  );
}

function Offres() {
  const wrap = useRef(null);
  const [actif, setActif] = useState(0);

  const onScroll = () => {
    const el = wrap.current;
    if (!el) return;
    const cartes = el.querySelectorAll(".slide");
    if (!cartes.length) return;
    const centre = el.scrollLeft + el.clientWidth / 2;
    let best = 0, dist = Infinity;
    cartes.forEach((c, i) => {
      const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - centre);
      if (d < dist) { dist = d; best = i; }
    });
    setActif(best);
  };

  const aller = (i) => {
    const el = wrap.current;
    if (!el) return;
    const c = el.querySelectorAll(".slide")[i];
    if (c) el.scrollTo({ left: c.offsetLeft - (el.clientWidth - c.offsetWidth) / 2, behavior: "smooth" });
  };

  return (
    <div>
      <H2 sur="Les formats">{C.offresTitre}</H2>
      <Section style={{ paddingTop: 0 }}>
        <p style={{ textAlign: "center", color: MUTED, fontSize: 14.5, lineHeight: 1.6, maxWidth: 620, margin: "-14px auto 22px" }}>{C.offresSous}</p>
      </Section>

      <div className="sliderWrap" ref={wrap} onScroll={onScroll}>
        <div className="slider">
          {C.offres.map((o, i) => (
            <div key={i} className="slide">
              <div
                role="button" tabIndex={0}
                onClick={ouvrirForm}
                onKeyDown={e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); ouvrirForm(); } }}
                style={{
                background: o.populaire ? "linear-gradient(180deg, rgba(255,46,137,.10), #0d0d0d 42%)" : CARD2,
                border: `1px solid ${o.populaire ? "rgba(255,46,137,.5)" : BORDER}`,
                borderRadius: 20, padding: "24px 20px 22px", height: "100%",
                display: "flex", flexDirection: "column", cursor: "pointer",
                boxShadow: o.populaire ? "0 12px 44px rgba(255,46,137,.13)" : "none",
              }}>
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 12 }}>
                  <div style={{ fontSize: 22, fontWeight: 900, color: "#fff" }}>{o.nom}</div>
                  {o.populaire && (
                    <span style={{ background: `linear-gradient(135deg, ${PINK}, ${PINK_DK})`, color: "#fff", fontSize: 10.5, fontWeight: 800, letterSpacing: ".1em", padding: "5px 11px", borderRadius: 999, textTransform: "uppercase" }}>Le plus pris</span>
                  )}
                </div>

                <p style={{ fontSize: 14, color: MUTED, lineHeight: 1.6, marginBottom: 18 }}>{o.pitch}</p>

                <div style={{ background: "rgba(255,46,137,.07)", border: "1px solid rgba(255,46,137,.22)", borderRadius: 12, padding: "12px 14px", marginBottom: 16 }}>
                  <div style={{ fontSize: 10.5, color: PINK2, fontWeight: 800, letterSpacing: ".12em", textTransform: "uppercase", marginBottom: 4 }}>Objectif visé</div>
                  <div style={{ fontSize: 16.5, fontWeight: 800, color: "#fff" }}>{o.objectif}</div>
                </div>

                <div style={{ marginBottom: 18 }}>
                  {o.points.map((pt, j) => (
                    <div key={j} style={{ display: "flex", gap: 10, alignItems: "flex-start", marginBottom: 9 }}>
                      <span style={{ color: PINK, fontSize: 13, lineHeight: 1.5 }}>✓</span>
                      <span style={{ fontSize: 13.5, color: "#dcdcdc", lineHeight: 1.5 }}>{pt}</span>
                    </div>
                  ))}
                </div>

                <div style={{ marginTop: "auto", borderTop: `1px solid ${BORDER}`, paddingTop: 14 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 9 }}>

// Les questions du formulaire. Pour en modifier une, c'est ici et nulle part ailleurs.

const VOIE_DIRECTE = "Je suis décidé, je veux démarrer directement";

// si aucune vidéo n'est renseignée, l'étape disparaît du formulaire
const ETAPES = QUESTIONS.filter(q => !q.video || C.videoOffre);

// ══════════════════════════════════════════════════════════════
//  L'ÉTAPE VIDÉO
//  1. le texte d'abord, puis un bouton pour lancer la vidéo
//  2. on cumule le temps RÉELLEMENT lu : avancer la barre à la main ne compte pas
//  3. "Suivant" ne se débloque qu'à la fin de la vidéo
//  4. si la vidéo ne charge pas, on débloque : jamais de lead piégé
// ══════════════════════════════════════════════════════════════
function EtapeVideo({ vues, setVues, ko, setKo, ouverte, setOuverte, duree, setDuree }) {
  const ref = useRef(null);
  const precedent = useRef(0);

  useEffect(() => {
    const v = ref.current;
    if (!v || !ouverte) return;

    const suivre = () => {
      const t = v.currentTime || 0;
      const ecart = t - precedent.current;
      // un écart normal de lecture fait moins d'1,5 s ; au-delà c'est un saut manuel
      if (ecart > 0 && ecart < 1.5) setVues(x => x + ecart);
      precedent.current = t;
    };
    const charger = () => setDuree(v.duration || 0);
    const finie = () => setVues(x => Math.max(x, (v.duration || 0)));
    const rate = () => setKo(true);

    v.addEventListener("timeupdate", suivre);
    v.addEventListener("loadedmetadata", charger);
    v.addEventListener("durationchange", charger);
    v.addEventListener("ended", finie);
    v.addEventListener("error", rate);
    const minuteur = setTimeout(() => { if (!v.duration) setKo(true); }, 6000);
    v.play().catch(() => {});

    return () => {
      clearTimeout(minuteur);
      v.removeEventListener("timeupdate", suivre);
      v.removeEventListener("loadedmetadata", charger);
      v.removeEventListener("durationchange", charger);
      v.removeEventListener("ended", finie);
      v.removeEventListener("error", rate);
    };
  }, [ouverte, setVues, setKo, setDuree]);

  const cible = duree || C.secondesMiniVideo || 60;
  const reste = Math.max(0, Math.ceil(cible - vues));

  return (
    <div>
      {/* Le texte disparaît dès que la vidéo est lancée : elle a toute la place. */}
      {!ouverte && (
        <>
          <div style={{ background: "rgba(255,46,137,.12)", border: "1px solid rgba(255,46,137,.4)", borderRadius: 12, padding: "11px 13px", marginBottom: 12 }}>
            <div style={{ fontSize: 14, fontWeight: 800, color: "#fff", lineHeight: 1.4 }}>{C.videoOffreTitre}</div>
          </div>
          <p style={{ fontSize: 13.5, color: "#c8c8c8", lineHeight: 1.55, marginBottom: 14 }}>{C.videoOffreTexte}</p>
        </>
      )}

      {!ouverte ? (
        <button onClick={() => setOuverte(true)} className="cta"
          style={{ boxShadow: `0 0 30px rgba(255,46,137,.3)` }}>
          ▶ Voir la vidéo
        </button>
      ) : (
        <>
          <video ref={ref} src={C.videoOffre} controls playsInline preload="auto"
            style={C.videoVerticale
              ? { display: "block", margin: "0 auto", height: "min(58vh, 440px)", maxWidth: "100%",
                  aspectRatio: "9 / 16", objectFit: "contain",
                  borderRadius: 14, border: `1px solid ${BORDER}`, background: "#000" }
              : { width: "100%", borderRadius: 14, border: `1px solid ${BORDER}`, background: "#000", display: "block" }} />
          {!ko && reste > 0 && (
            <div style={{ marginTop: 12 }}>
              <div style={{ height: 5, borderRadius: 999, background: BORDER, overflow: "hidden" }}>
                <div style={{ height: "100%", width: Math.min(100, (vues / cible) * 100) + "%", background: PINK, transition: "width .3s" }} />
              </div>
              <div style={{ fontSize: 12.5, color: MUTED, marginTop: 8, lineHeight: 1.5 }}>
                🔒 Regarde la vidéo en entier pour débloquer la suite — encore {reste} secondes.
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function Popup() {
  const [open, setOpen] = useState(false);
  const [step, setStep] = useState(0);
  const [rep, setRep] = useState({});
  const [prenom, setPrenom] = useState("");
  const [insta, setInsta] = useState("");
  const [indicatif, setIndicatif] = useState("+33");
  const [tel, setTel] = useState("");
  const [ok, setOk] = useState(false);
  const [sent, setSent] = useState(false);
  const [vues, setVues] = useState(0);   // secondes de vidéo réellement regardées
  const [videoKo, setVideoKo] = useState(false);
  const [videoOuverte, setVideoOuverte] = useState(false);
  const [videoDuree, setVideoDuree] = useState(0);
  const [piege, setPiege] = useState("");   // champ invisible : seuls les bots le remplissent

  useEffect(() => {
    const h = () => { setOpen(true); };
    window.addEventListener("meida:open", h);
    return () => window.removeEventListener("meida:open", h);
  }, []);

  useEffect(() => {
    document.body.style.overflow = open ? "hidden" : "";
    return () => { document.body.style.overflow = ""; };
  }, [open]);

  if (!open) return null;

  const chiffres = tel.replace(/[^0-9]/g, "");
  const telOk = chiffres.length >= 8 && chiffres.length <= 12;
  const telComplet = indicatif + (chiffres.startsWith("0") ? chiffres.slice(1) : chiffres);
  const valide = prenom.trim().length >= 2 && telOk && ok;

  const envoyer = () => {
    if (sent || !valide) return;
    setSent(true);
    const d = new URLSearchParams();
    ETAPES.forEach(({ k }) => {
      const v = rep[k];
      d.append(k, Array.isArray(v) ? v.join(" · ") : (v || ""));
    });
    d.append("video_vue", C.videoOffre ? String(Math.round(vues)) + " s" : "");
    d.append("prenom", prenom);
    d.append("insta", insta.replace(/^@/, ""));
    d.append("telephone", telComplet);
    d.append("k", CLE);
    d.append("site", piege);
    try {
      fetch(SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: d.toString() })
        .catch(() => {});
    } catch (e) {}
  };

  const entete = !sent && step === 0;   // titre complet seulement au premier écran

  const fermer = () => { setOpen(false); };
  const total = ETAPES.length + 1;

  return (
    <div onClick={fermer} style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,.82)", backdropFilter: "blur(6px)", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "20px 14px", overflowY: "auto", animation: "fadeIn .2s ease" }}>
      <div onClick={e => e.stopPropagation()} style={{ width: "100%", maxWidth: 500, background: "#0f0f0f", border: `1px solid ${BORDER}`, borderRadius: 22, padding: "20px 20px 24px", position: "relative", animation: "slideDown .3s ease", marginTop: 10, marginBottom: 30 }}>

        <button onClick={fermer} aria-label="Fermer" style={{ position: "absolute", top: 16, right: 16, background: "none", border: "none", color: "#777", fontSize: 22, cursor: "pointer", lineHeight: 1 }}>×</button>

        {/* L'en-tête complet n'apparaît qu'au premier écran : ensuite on rend la place aux réponses. */}
        <div style={{ display: "flex", justifyContent: "center", marginBottom: entete ? 16 : 12 }}>
          <span style={{ background: "#fff", color: "#000", borderRadius: 999, padding: entete ? "9px 22px" : "6px 16px", fontSize: entete ? 15 : 12.5, fontWeight: 800 }}>{C.marque}</span>
        </div>

        {entete && (
          <>
            <div style={{ textAlign: "center", color: MUTED, fontSize: 11.5, fontWeight: 700, letterSpacing: ".14em", textTransform: "uppercase", lineHeight: 1.6, marginBottom: 10 }}>{C.popSous}</div>
            <h3 style={{ textAlign: "center", fontSize: 25, fontWeight: 900, color: "#fff", lineHeight: 1.2, marginBottom: 20 }}>
              {C.popTitre1}<br /><span style={{ color: PINK }}>{C.popTitre2}</span>
            </h3>
          </>
        )}

        {!sent && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: entete ? 22 : 16 }}>
            {Array.from({ length: total }).map((_, i) => (
              <div key={i} style={{ height: 4, flex: 1, maxWidth: 54, borderRadius: 2, background: i <= step ? PINK : "#2b2b2b", transition: "background .3s" }} />
            ))}
          </div>
        )}

        {!sent && step < ETAPES.length && (() => {
          const Q = ETAPES[step];
          const val = rep[Q.k];
          const choisies = Array.isArray(val) ? val : [];
          // la vidéo doit avoir été lue en entier (95 % suffit, pour les fins tronquées)
          const assezVue = videoKo || (videoDuree > 0 && vues >= videoDuree * 0.95);
          const suivantOk = Q.video ? assezVue
            : Q.multi ? choisies.length > 0
            : String(val || "").trim().length >= 3;

          const basculer = opt => {
            const d = choisies.includes(opt) ? choisies.filter(x => x !== opt) : choisies.concat([opt]);
            setRep({ ...rep, [Q.k]: d });
          };

          return (
            <div>
              {step > 0 && <button onClick={() => setStep(step - 1)} style={{ background: "none", border: "none", color: MUTED, fontSize: 13, cursor: "pointer", marginBottom: 12, padding: 0, fontFamily: "inherit" }}>← Retour</button>}
              <div style={{ fontSize: 17.5, fontWeight: 800, color: "#fff", marginBottom: Q.sous ? 6 : 16, lineHeight: 1.4 }}>{Q.q}</div>
              {Q.sous && <div style={{ fontSize: 13, color: MUTED, marginBottom: 16 }}>{Q.sous}</div>}

              {Q.video ? (
                <EtapeVideo vues={vues} setVues={setVues} ko={videoKo} setKo={setVideoKo}
                  ouverte={videoOuverte} setOuverte={setVideoOuverte} duree={videoDuree} setDuree={setVideoDuree} />
              ) : Q.texte ? (
                <textarea value={val || ""} onChange={e => setRep({ ...rep, [Q.k]: e.target.value })}
                  rows={5} className="inp" placeholder="Écris-nous tout ce qui compte."
                  style={{ resize: "vertical", lineHeight: 1.6 }} />
              ) : (
                Q.o.map(opt => {
                  const sel = Q.multi ? choisies.includes(opt) : val === opt;
                  return (
                    <div key={opt}
                      onClick={() => {
                        if (Q.multi) { basculer(opt); return; }
                        setRep({ ...rep, [Q.k]: opt });
                        setTimeout(() => setStep(step + 1), 160);
                      }}
                      style={{ display: "flex", alignItems: "center", gap: 12, border: `1px solid ${sel ? PINK : BORDER}`, background: sel ? "rgba(255,46,137,.12)" : CARD2, borderRadius: 12, padding: "13px 16px", marginBottom: 8, cursor: "pointer", color: "#fff", fontSize: 14.5, lineHeight: 1.4, transition: "border-color .2s, background .2s" }}>
                      {Q.multi && (
                        <span style={{ width: 20, height: 20, flexShrink: 0, borderRadius: 6, border: `1.5px solid ${sel ? PINK : "#3a3a3a"}`, background: sel ? PINK : "transparent", color: "#fff", fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 900 }}>{sel ? "✓" : ""}</span>
                      )}
                      <span>{opt}</span>
                    </div>
                  );
                })
              )}

              {((Q.multi || Q.texte) || (Q.video && videoOuverte)) && (
                <button onClick={() => suivantOk && setStep(step + 1)} disabled={!suivantOk} className="cta"
                  style={{ marginTop: 16, opacity: suivantOk ? 1 : .4, cursor: suivantOk ? "pointer" : "not-allowed" }}>
                  Suivant
                </button>
              )}
            </div>
          );
        })()}

        {!sent && step === ETAPES.length && (
          <div>
            <button onClick={() => setStep(step - 1)} style={{ background: "none", border: "none", color: "#666", fontSize: 13, cursor: "pointer", marginBottom: 14, padding: 0, fontFamily: "inherit" }}>← Retour</button>

            <input type="text" name="site" value={piege} onChange={e => setPiege(e.target.value)}
              tabIndex={-1} autoComplete="off" aria-hidden="true"
              style={{ position: "absolute", left: "-9999px", width: 1, height: 1, opacity: 0 }} />

            <label className="lab">Prénom</label>
            <input value={prenom} onChange={e => setPrenom(e.target.value)} placeholder="Ton prénom" className="inp" />

            <label className="lab">Ton pseudo Instagram</label>
            <input type="text" value={insta} onChange={e => setInsta(e.target.value)} placeholder="@tonpseudo" className="inp" autoCapitalize="none" autoCorrect="off" />

            <label className="lab">Numéro WhatsApp</label>
            <div style={{ display: "flex", gap: 9 }}>
              <select value={indicatif} onChange={e => setIndicatif(e.target.value)} className="inp" style={{ width: 132, flexShrink: 0 }}>
                {PAYS.map(([n, c], i) => <option key={i} value={c}>{n} {c}</option>)}
              </select>
              <input type="tel" inputMode="tel" value={tel} onChange={e => setTel(e.target.value)} placeholder="6 12 34 56 78" className="inp" style={{ flex: 1, minWidth: 0 }} />
            </div>

            <label style={{ display: "flex", gap: 11, alignItems: "flex-start", marginTop: 16, cursor: "pointer" }}>
              <input type="checkbox" checked={ok} onChange={e => setOk(e.target.checked)} style={{ width: 19, height: 19, accentColor: PINK, flexShrink: 0, marginTop: 1 }} />
              <span style={{ fontSize: 12.5, color: MUTED, lineHeight: 1.55 }}>
                Je confirme que mon numéro est valide. Sans numéro correct, je ne pourrai pas être recontacté.
              </span>
            </label>

            <button onClick={envoyer} disabled={!valide} className="cta"
              style={{ marginTop: 20, opacity: valide ? 1 : .4, cursor: valide ? "pointer" : "not-allowed", boxShadow: valide ? `0 0 30px rgba(255,46,137,.3)` : "none" }}>
              Envoyer ma demande
            </button>
          </div>
        )}

        {sent && (() => {
          const direct = rep.voie === VOIE_DIRECTE;
          const lienWa = `https://wa.me/${LINKS.whatsapp}?text=` + encodeURIComponent(
            direct
              ? `Salut, j'ai rempli le formulaire et je suis décidé. Budget ${rep.budget || "—"}, dispo ${rep.delai || "—"}.`
              : `Salut, je viens de remplir le formulaire (budget ${rep.budget || "—"}).`
          );

          return (
            <div style={{ textAlign: "center", padding: "10px 0 4px" }}>
              <div style={{ width: 58, height: 58, borderRadius: "50%", background: `linear-gradient(135deg, ${PINK}, ${PINK_DK})`, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 20px", fontSize: 28, color: "#fff" }}>✓</div>
              <div style={{ fontSize: 22, fontWeight: 800, color: "#fff", marginBottom: 12 }}>C'est envoyé, {prenom}.</div>

              {!direct && (
                <p style={{ fontSize: 14.5, color: "#c8c8c8", lineHeight: 1.7, marginBottom: 16 }}>
                  On cale ton appel directement sur WhatsApp. Écris-nous maintenant, c'est là que ça se décide.
                </p>
              )}

              {!direct && (
                <div style={{ background: "rgba(255,46,137,.10)", border: "1px solid rgba(255,46,137,.35)", borderRadius: 14, padding: "15px 17px", marginBottom: 18, textAlign: "left" }}>
                  <div style={{ fontSize: 14.5, fontWeight: 800, color: "#fff", marginBottom: 6 }}>On traite les demandes dans l'ordre.</div>
                  <div style={{ fontSize: 13.5, color: "#c8c8c8", lineHeight: 1.6 }}>
                    Réponds quand on t'écrit. Sans réponse de ta part, on passe au suivant.
                  </div>
                </div>
              )}

              {(() => {
                const vid = direct ? C.videoConfirmationDirect : C.videoConfirmationAppel;
                if (!vid) return null;
                return (
                  <div style={{ marginBottom: 16 }}>
                    {C.videoConfirmationTitre && (
                      <div style={{ fontSize: 13.5, fontWeight: 800, color: "#fff", marginBottom: 8, textAlign: "left" }}>
                        {C.videoConfirmationTitre}
                      </div>
                    )}
                    <video src={vid} controls playsInline preload="metadata"
                      style={{ width: "100%", borderRadius: 14, border: `1px solid ${BORDER}`, background: "#000", display: "block" }} />
                  </div>
                );
              })()}

              <a href={lienWa} target="_blank" rel="noopener noreferrer" className="cta" style={{ display: "block", textDecoration: "none", boxShadow: `0 0 30px rgba(255,46,137,.3)` }}>
                💬 Écrire sur WhatsApp maintenant
              </a>

              <button onClick={fermer} style={{ background: "none", border: "none", color: MUTED, fontSize: 13.5, cursor: "pointer", marginTop: 18, fontFamily: "inherit" }}>Revenir à la page</button>
            </div>
          );
        })()}
      </div>
    </div>
  );
}
